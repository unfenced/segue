[project]
name = "segue"
version = "0.1.0"
description = "Open, local-first playlist manager: back up, clean, merge and sync playlists across music services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
segue = "segue.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
