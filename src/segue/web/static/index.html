<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="segue-token" content="__SEGUE_TOKEN__">
  <title>Segue</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/library"><img src="icon.svg" alt="" width="22" height="22"> Segue</a>
    <nav class="tabs" id="tabs">
      <a href="#/library" data-view="library">Library</a>
      <a href="#/look" data-view="look">Needs a look</a>
      <a href="#/changes" data-view="changes">Changes <span class="count" id="staged-count" hidden></span></a>
      <a href="#/connect" data-view="connect">Services</a>
      <a href="#/settings" data-view="settings">Settings</a>
    </nav>
    <div class="top-actions">
      <span class="mode" id="mode" title="How changes are applied (change it in Settings)"></span>
      <button class="ghost" id="undo" title="Undo the last change">↶ Undo</button>
      <button class="ghost" id="redo" title="Redo">↷ Redo</button>
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="busy" class="busy" hidden><div class="busy-box"><div class="spinner"></div><p id="busy-text">Working…</p></div></div>
  <script src="app.js" type="module"></script>
</body>
</html>
